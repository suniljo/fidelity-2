
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            padding: 30px 15px;
            color: #334155;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .header {
            background: #243b70;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            margin-bottom: 8px;
            font-size: 28px;
        }

        .header p {
            color: #dce6ff;
            font-size: 14px;
        }

        .form-content {
            padding: 30px;
        }

        .section-title {
            font-size: 18px;
            color: #243b70;
            margin: 20px 0 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e2e8f0;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #334155;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            background: white;
            transition: 0.3s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #3457a1;
            box-shadow: 0 0 0 3px rgba(52,87,161,0.12);
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
            accent-color: #3457a1;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            align-items: center;
            min-height: 42px;
        }

        .options label {
            font-weight: normal;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn {
            background: #3457a1;
            color: white;
        }

        .submit-btn:hover {
            background: #243b70;
        }

        .reset-btn {
            background: #e2e8f0;
            color: #334155;
        }

        .reset-btn:hover {
            background: #cbd5e1;
        }

        .footer {
            text-align: center;
            padding: 18px;
            background: #f8fafc;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .form-content {
                padding: 20px;
            }

            .header h1 {
                font-size: 23px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Fidelity :: Apprentice Registration</h1>
        <p>Register today and begin your journey</p>
    </div>

    <div class="form-content">

        <form action="#" method="post">

            <!-- Personal Information -->

            <h2 class="section-title">
                Personal Information
            </h2>

            <div class="form-row">

                <div class="form-group">
                    <label for="regNo">
                        Registration Number
                    </label>
                    <input type="text" id="regNo"
                           name="regNo"
                           placeholder="Enter registration number"
                           required>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob"
                           name="dob" required>
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName"
                           name="firstName"
                           placeholder="Enter first name"
                           autocomplete="given-name"
                           required>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName"
                           name="lastName"
                           placeholder="Enter last name"
                           autocomplete="family-name"
                           required>
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>Gender</label>

                    <div class="options">
                        <label>
                            <input type="radio" name="gender"
                                   value="Male" required>
                            Male
                        </label>

                        <label>
                            <input type="radio" name="gender"
                                   value="Female">
                            Female
                        </label>

                        <label>
                            <input type="radio" name="gender"
                                   value="Other">
                            Other
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email"
                           name="email"
                           placeholder="student@example.com"
                           autocomplete="email"
                           required>
                </div>

            </div>

            <!-- Contact Information -->

            <h2 class="section-title">
                Contact Information
            </h2>

            <div class="form-row">

                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile"
                           name="mobile"
                           placeholder="10-digit mobile number"
                           pattern="[0-9]{10}"
                           maxlength="10"
                           autocomplete="tel"
                           title="Enter a 10-digit mobile number"
                           required>
                </div>

                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city"
                           name="city"
                           placeholder="Enter your city">
                </div>

            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" name="address"
                          placeholder="Enter your full address"></textarea>
            </div>

            <!-- Academic Information -->

            <h2 class="section-title">
                Academic Information
            </h2>

            <div class="form-row">

                <div class="form-group">
                    <label for="course">Select Course</label>

                    <select id="course" name="course" required>
                        <option value="">-- Select Course --</option>
                        <option value="Java">Java Programming</option>
                        <option value="Python">Python Programming</option>
                        <option value="FullStack">Full Stack Development</option>
                        <option value="DataScience">Data Science</option>
                        <option value="AI">Artificial Intelligence</option>
                        <option value="Cloud">Cloud Computing</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="qualification">
                        Qualification
                    </label>

                    <select id="qualification"
                            name="qualification" required>
                        <option value="">-- Select Qualification --</option>
                        <option value="12th">12th Standard</option>
                        <option value="Diploma">Diploma</option>
                        <option value="Graduate">Graduate</option>
                        <option value="PostGraduate">Post Graduate</option>
                    </select>
                </div>

            </div>

            <div class="form-group">
                <label>Hobbies</label>

                <div class="options">
                    <label>
                        <input type="checkbox" name="hobbies"
                               value="Reading">
                        Reading
                    </label>

                    <label>
                        <input type="checkbox" name="hobbies"
                               value="Music">
                        Music
                    </label>

                    <label>
                        <input type="checkbox" name="hobbies"
                               value="Sports">
                        Sports
                    </label>

                    <label>
                        <input type="checkbox" name="hobbies"
                               value="Coding">
                        Coding
                    </label>

                    <label>
                        <input type="checkbox" name="hobbies"
                               value="Traveling">
                        Traveling
                    </label>
                </div>
            </div>

            <!-- Buttons -->

            <div class="buttons">

                <button type="submit" class="submit-btn">
                    Register Student
                </button>

                <button type="reset" class="reset-btn">
                    Reset Form
                </button>

            </div>

        </form>

    </div>

    <div class="footer">
        © 2026 Fidelity | Student Registration Portal
    </div>

</div>

</body>
</html>
