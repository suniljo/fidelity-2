<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        table{
            width: 500px;
            font-size:19px;
            margin: auto;
            border-collapse: collapse;
            margin-top:100px;
            box-shadow: 0 0 10px black;
            border-radius: 12px;
            padding: 8px
        }
        td{
            border:1px soilid black;
            padding: 10px;
        }
        tr{
            height: 40px;
        }
    </style>
    <title>Library | Add Book</title>
</head>
<body>
    <form action="http://localhost:8080/api/library" method="post">
        <table>
            <tr>
                <td>Book ID</td>
                <td><input type="text" name="bookId" size="6" autofocus></td>
            </tr>
            <tr>
                <td>Title</td>
                <td><input type="text" name="bookTitle" size="16"></td>
            </tr>  
             <tr>
                <td>Price</td>
                <td><input type="number" name="bookPrice" size="8"></td>
            </tr>   
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Save Book"/>
                </td>
            </tr>                  
        </table>
    </form>
</body>
</html>
